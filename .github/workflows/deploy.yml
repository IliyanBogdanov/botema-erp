name: CI Studio Botema ERP

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Test Backend ────────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - run: cd backend && npm ci
      - run: cd backend && npx prisma generate
      - run: echo "✓ Backend build OK"

  # ─── Test Frontend ───────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

# Deploys are NOT handled here:
# - Backend (Railway) has its own native GitHub integration — auto-deploys on push to master.
# - Frontend (Vercel) needs the same: connect the repo in the Vercel dashboard
#   (Project Settings → Git → Connect Git Repository) so it auto-deploys too.
#   Until that's connected, deploy manually: cd frontend && vercel --prod
